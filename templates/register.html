<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Clinic Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="antialiased bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4 py-12">

    <div class="glass max-w-lg w-full p-8 rounded-3xl shadow-xl fade-in-up" id="registerCard">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900">Create Account</h2>
            <p class="text-slate-500 mt-2">Join us to book your appointments</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Age</label>
                    <input type="number" id="age" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Gender</label>
                    <select id="gender" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                <input type="tel" id="phone" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            
            <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-200 transition transform hover:-translate-y-0.5 mt-2">
                Register
            </button>
        </form>
        
        <p class="text-center text-slate-600 mt-6">
            Already have an account? <a href="/login" class="text-blue-600 font-semibold hover:underline">Sign In</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from("#registerCard", { y: 30, opacity: 0, duration: 0.8, ease: "power3.out" });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.classList.add('hidden');
            
            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.classList.remove('hidden');
                gsap.fromTo(errorMsg, {x: -10}, {x: 0, duration: 0.2, ease: "bounce.out"});
                return;
            }
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, age, gender, email, phone, password})
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/login';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.classList.remove('hidden');
                    gsap.fromTo(errorMsg, {x: -10}, {x: 0, duration: 0.2, ease: "bounce.out"});
                }
            } catch (err) {
                errorMsg.textContent = "Network error occurred";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
