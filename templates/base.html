<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareBridge - Digital Health Mission{% endblock %}</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Base ABDM Theme CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/abdm_theme.css') }}?v=6">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Top Header Component -->
  {% include 'components/header.html' %}

  <!-- Main Application Body: Sidebar + Main Content -->
  <div class="abdm-layout">
    {% include 'components/sidebar.html' %}

    <main class="abdm-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Deep Navy Footer Component -->
  {% include 'components/footer.html' %}

  <!-- Toast Alert Container -->
  <div id="toastContainer" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px;"></div>

  <!-- Global JavaScript helper routines -->
  <script>
    // Synchronize authenticated user identity dynamically across all pages
    async function syncAuthenticatedUser() {
      const token = localStorage.getItem('token');
      const role = localStorage.getItem('role');
      const isDoctorOrAdmin = window.location.pathname.startsWith('/doctor') || 
                              window.location.pathname.startsWith('/admin') || 
                              window.location.pathname.startsWith('/clinic_dashboard');

      // Purge mismatched non-patient session from citizen portal
      if (!isDoctorOrAdmin && role && role !== 'patient') {
        localStorage.removeItem('name');
        localStorage.removeItem('token');
        localStorage.removeItem('role');
      }

      try {
        const headers = {};
        if (token && role === 'patient') {
          headers['Authorization'] = 'Bearer ' + token;
        }
        const res = await fetch('/api/patient/profile', { headers });
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            const patient = json.data;
            const name = patient.name || 'Sajil Binu';
            const initial = (name.trim().charAt(0) || 'S').toUpperCase();

            // Persist the consistent patient name in localStorage
            if (!isDoctorOrAdmin) {
              localStorage.setItem('name', name);
              localStorage.setItem('patient_id', patient._id || patient.id || '');
              if (patient.health_id) localStorage.setItem('health_id', patient.health_id);
            }

            // Dynamically update header display elements
            const navUserName = document.getElementById('navUserName');
            const navAvatarInitials = document.getElementById('navAvatarInitials');
            if (navUserName) navUserName.textContent = name;
            if (navAvatarInitials) navAvatarInitials.textContent = initial;

            // Dynamically update any element marked as patient-auth-name across the active page
            document.querySelectorAll('.patient-auth-name').forEach(el => {
              el.textContent = name;
            });

            // Dispatch global event for page-specific components
            window.dispatchEvent(new CustomEvent('patientProfileSynced', { detail: patient }));
          }
        }
      } catch (err) {
        console.warn('Authenticated profile sync note:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const isDoctorOrAdmin = window.location.pathname.startsWith('/doctor') || 
                              window.location.pathname.startsWith('/admin') || 
                              window.location.pathname.startsWith('/clinic_dashboard');

      const role = localStorage.getItem('role');
      if (!isDoctorOrAdmin && role && role !== 'patient') {
        localStorage.removeItem('name');
        localStorage.removeItem('token');
        localStorage.removeItem('role');
      }

      const storedName = localStorage.getItem('name');
      const navUserName = document.getElementById('navUserName');
      const navAvatarInitials = document.getElementById('navAvatarInitials');
      if (storedName) {
        if (navUserName) navUserName.textContent = storedName;
        if (navAvatarInitials) navAvatarInitials.textContent = (storedName.trim().charAt(0) || 'S').toUpperCase();
      }

      // Fetch authentic patient record from /api/patient/profile
      syncAuthenticatedUser();
    });

    function toggleUserDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('userDropdown');
      const notifMenu = document.getElementById('notificationDropdown');
      if (notifMenu) notifMenu.classList.remove('show');
      if (menu) menu.classList.toggle('show');
    }

    function toggleNotificationDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('notificationDropdown');
      const userMenu = document.getElementById('userDropdown');
      if (userMenu) userMenu.classList.remove('show');
      if (menu) menu.classList.toggle('show');
    }

    // Close open menus when clicking anywhere else
    document.addEventListener('click', () => {
      const userMenu = document.getElementById('userDropdown');
      const notifMenu = document.getElementById('notificationDropdown');
      if (userMenu) userMenu.classList.remove('show');
      if (notifMenu) notifMenu.classList.remove('show');
    });

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      localStorage.removeItem('name');
      window.location.href = '/login';
    }

    // Interactive Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? '#16A05D' : (type === 'error' ? '#DC2626' : '#0066E6');
      toast.style.cssText = `
        background: #FFFFFF;
        border-left: 4px solid ${bgColor};
        color: #12345B;
        padding: 12px 18px;
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        font-size: 13.5px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 260px;
        animation: slideIn 0.2s ease-out;
      `;
      toast.innerHTML = `
        <span style="color:${bgColor}; font-weight:700;">●</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
