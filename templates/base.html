<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareBridge - Digital Health Mission{% endblock %}</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Base ABDM Theme CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/abdm_theme.css') }}?v=12">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Top Header Component -->
  {% include 'components/header.html' %}

  <!-- Main Application Body: Sidebar + Main Content -->
  <div class="abdm-layout">
    {% include 'components/sidebar.html' %}

    <main class="abdm-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Deep Navy Footer Component -->
  {% include 'components/footer.html' %}

  <!-- Toast Alert Container -->
  <div id="toastContainer" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px;"></div>

  <!-- Global JavaScript helper routines -->
  <script>
    // Synchronize authenticated user identity dynamically across all pages
    async function syncAuthenticatedUser() {
      const token = localStorage.getItem('token');
      const headers = {};
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }

      try {
        const res = await fetch('/api/auth/me', { headers });
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            const user = json.data;
            const name = user.name || 'User';
            const initial = (name.trim().charAt(0) || 'U').toUpperCase();

            // Persist user in window global and localStorage
            window.authenticatedUser = user;
            localStorage.setItem('name', name);
            localStorage.setItem('role', user.role || 'patient');
            if (user.id) localStorage.setItem('patient_id', user.id);
            if (user.health_id) localStorage.setItem('health_id', user.health_id);

            // Show header auth actions with dynamic button state (Sign Out only when authenticated)
            const headerLoginBtn = document.getElementById('headerLoginBtn');
            const headerSignupBtn = document.getElementById('headerSignupBtn');
            const headerSignoutBtn = document.getElementById('headerSignoutBtn');
            const headerTopUserWrap = document.getElementById('headerTopUserWrap');
            const headerTopUserName = document.getElementById('headerTopUserName');
            const headerTopAvatar = document.getElementById('headerTopAvatarInitials');
            const navUserName = document.getElementById('navUserName');
            const navAvatarInitials = document.getElementById('navAvatarInitials');
            const userProfileChip = document.getElementById('userProfileChip');
            const tier2NavAuth = document.getElementById('tier2NavAuthActions');
            const navNotifWrapper = document.getElementById('navNotificationWrapper');

            if (headerLoginBtn) headerLoginBtn.style.display = 'none';
            if (headerSignupBtn) headerSignupBtn.style.display = 'none';
            if (headerTopUserWrap) headerTopUserWrap.style.display = 'inline-flex';
            if (headerSignoutBtn) headerSignoutBtn.style.display = 'inline-flex';
            if (tier2NavAuth) tier2NavAuth.style.display = 'none';

            if (userProfileChip) {
              userProfileChip.style.display = 'flex';
              userProfileChip.classList.remove('hidden-logged-out');
            }
            if (navNotifWrapper) navNotifWrapper.style.display = 'block';
            if (navUserName) navUserName.textContent = name;
            if (headerTopUserName) headerTopUserName.textContent = name;
            if (headerTopAvatar) headerTopAvatar.textContent = initial;
            if (navAvatarInitials) {
              const span = navAvatarInitials.querySelector('span');
              if (span) span.textContent = initial;
              else navAvatarInitials.textContent = initial;
            }

            // Dynamically update any element marked as patient-auth-name across the active page
            document.querySelectorAll('.patient-auth-name').forEach(el => {
              el.textContent = name;
            });

            // Dispatch global event for page-specific components
            window.dispatchEvent(new CustomEvent('patientProfileSynced', { detail: user }));
            return;
          }
        }

        const serverIsAuth = {{ 'true' if is_authenticated else 'false' }};
        if (serverIsAuth) {
          // If server rendered this page as authenticated, preserve authenticated UI
          const headerLoginBtn = document.getElementById('headerLoginBtn');
          const headerSignupBtn = document.getElementById('headerSignupBtn');
          const headerSignoutBtn = document.getElementById('headerSignoutBtn');
          const headerTopUserWrap = document.getElementById('headerTopUserWrap');
          const userProfileChip = document.getElementById('userProfileChip');
          const tier2NavAuth = document.getElementById('tier2NavAuthActions');
          const navNotifWrapper = document.getElementById('navNotificationWrapper');

          if (headerLoginBtn) headerLoginBtn.style.display = 'none';
          if (headerSignupBtn) headerSignupBtn.style.display = 'none';
          if (headerTopUserWrap) headerTopUserWrap.style.display = 'inline-flex';
          if (headerSignoutBtn) headerSignoutBtn.style.display = 'inline-flex';
          if (tier2NavAuth) tier2NavAuth.style.display = 'none';

          if (userProfileChip) {
            userProfileChip.style.display = 'flex';
            userProfileChip.classList.remove('hidden-logged-out');
          }
          if (navNotifWrapper) navNotifWrapper.style.display = 'block';
          return;
        }

        // When truly unauthenticated / logged-out:
        // SHOW Login and Sign Up in both Top Header and Navigation
        const headerLoginBtn = document.getElementById('headerLoginBtn');
        const headerSignupBtn = document.getElementById('headerSignupBtn');
        const headerSignoutBtn = document.getElementById('headerSignoutBtn');
        const headerTopUserWrap = document.getElementById('headerTopUserWrap');
        const userProfileChip = document.getElementById('userProfileChip');
        const tier2NavAuth = document.getElementById('tier2NavAuthActions');
        const navNotifWrapper = document.getElementById('navNotificationWrapper');

        if (headerLoginBtn) headerLoginBtn.style.display = 'inline-flex';
        if (headerSignupBtn) headerSignupBtn.style.display = 'inline-flex';
        if (headerTopUserWrap) headerTopUserWrap.style.display = 'none';
        if (headerSignoutBtn) headerSignoutBtn.style.display = 'none';
        if (tier2NavAuth) tier2NavAuth.style.display = 'flex';

        if (userProfileChip) {
          userProfileChip.style.display = 'none';
          userProfileChip.classList.add('hidden-logged-out');
        }
        if (navNotifWrapper) navNotifWrapper.style.display = 'none';

        // Clear stale local storage
        localStorage.removeItem('name');
        localStorage.removeItem('token');
        localStorage.removeItem('role');
        localStorage.removeItem('patient_id');
        localStorage.removeItem('health_id');
      } catch (err) {
        console.warn('Authenticated profile sync note:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncAuthenticatedUser();
    });

    function toggleUserDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('userDropdown');
      const topMenu = document.getElementById('headerTopUserDropdown');
      const notifMenu = document.getElementById('notificationDropdown');
      if (topMenu) topMenu.classList.remove('show');
      if (notifMenu) notifMenu.classList.remove('show');
      if (menu) menu.classList.toggle('show');
    }

    function toggleNotificationDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('notificationDropdown');
      const userMenu = document.getElementById('userDropdown');
      const topMenu = document.getElementById('headerTopUserDropdown');
      if (topMenu) topMenu.classList.remove('show');
      if (userMenu) userMenu.classList.remove('show');
      if (menu) menu.classList.toggle('show');
    }

    // Close open menus when clicking anywhere else
    document.addEventListener('click', () => {
      const userMenu = document.getElementById('userDropdown');
      const topMenu = document.getElementById('headerTopUserDropdown');
      const notifMenu = document.getElementById('notificationDropdown');
      if (userMenu) userMenu.classList.remove('show');
      if (topMenu) topMenu.classList.remove('show');
      if (notifMenu) notifMenu.classList.remove('show');
    });

    async function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      localStorage.removeItem('name');
      localStorage.removeItem('patient_id');
      localStorage.removeItem('health_id');
      localStorage.removeItem('cached_appointments');
      localStorage.removeItem('booking_state');
      if (window.sessionStorage) sessionStorage.clear();
      document.cookie = "auth_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "auth_role=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "auth_name=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "auth_patient_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "auth_health_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

      const headerLoginBtn = document.getElementById('headerLoginBtn');
      const headerSignupBtn = document.getElementById('headerSignupBtn');
      const headerSignoutBtn = document.getElementById('headerSignoutBtn');
      const headerTopUserWrap = document.getElementById('headerTopUserWrap');
      const userProfileChip = document.getElementById('userProfileChip');
      const tier2NavAuth = document.getElementById('tier2NavAuthActions');
      const navNotifWrapper = document.getElementById('navNotificationWrapper');

      if (headerLoginBtn) headerLoginBtn.style.display = 'inline-flex';
      if (headerSignupBtn) headerSignupBtn.style.display = 'inline-flex';
      if (headerTopUserWrap) headerTopUserWrap.style.display = 'none';
      if (headerSignoutBtn) headerSignoutBtn.style.display = 'none';
      if (tier2NavAuth) tier2NavAuth.style.display = 'flex';

      if (userProfileChip) {
        userProfileChip.style.display = 'none';
        userProfileChip.classList.add('hidden-logged-out');
      }
      if (navNotifWrapper) navNotifWrapper.style.display = 'none';

      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch(e) {}

      window.location.href = '/login';
    }

    // Interactive Toast Notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? '#16A05D' : (type === 'error' ? '#DC2626' : '#0066E6');
      toast.style.cssText = `
        background: #FFFFFF;
        border-left: 4px solid ${bgColor};
        color: #12345B;
        padding: 12px 18px;
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        font-size: 13.5px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 260px;
        animation: slideIn 0.2s ease-out;
      `;
      toast.innerHTML = `
        <span style="color:${bgColor}; font-weight:700;">●</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
