<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Clinic Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="antialiased bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full p-8 rounded-3xl shadow-xl fade-in-up" id="loginCard">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900">Welcome Back</h2>
            <p class="text-slate-500 mt-2">Login to manage your appointments</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Login As</label>
                <select id="role" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition bg-white/50">
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="main_admin">Main Admin (Network)</option>
                    <option value="clinic_admin">Clinic Admin</option>
                </select>
            </div>
            
            <div id="errorMsg" class="text-red-500 text-sm hidden"></div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-200 transition transform hover:-translate-y-0.5">
                Sign In
            </button>
        </form>
        
        <p class="text-center text-slate-600 mt-6">
            Don't have an account? <a href="/register" class="text-blue-600 font-semibold hover:underline">Register</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from("#loginCard", { y: 30, opacity: 0, duration: 0.8, ease: "power3.out" });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password, role})
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.data.access_token);
                    localStorage.setItem('role', role);
                    localStorage.setItem('name', data.data.name);
                    
                    if (role === 'patient') window.location.href = '/';
                    else if (role === 'doctor') window.location.href = '/doctor';
                    else if (role === 'main_admin') window.location.href = '/admin';
                    else if (role === 'clinic_admin') window.location.href = '/clinic_dashboard';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.classList.remove('hidden');
                    gsap.fromTo(errorMsg, {x: -10}, {x: 0, duration: 0.2, ease: "bounce.out"});
                }
            } catch (err) {
                errorMsg.textContent = "Network error occurred";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
